# Cheap check on every push: shell and Python syntax of the install scripts. No AWS access needed.
name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          rc=0
          for f in run-all.sh scripts/*.sh scripts/cert-renewal/*.sh demo-data/*.sh; do
            bash -n "$f" && echo "ok  $f" || { echo "FAIL $f"; rc=1; }
          done
          exit $rc
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py demo-data/*.py build_recording_script.py
      - name: shellcheck (errors only)
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck not installed on this runner; skipped"; exit 0; }
          shellcheck -S error run-all.sh scripts/*.sh scripts/cert-renewal/*.sh demo-data/*.sh
