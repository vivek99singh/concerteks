# IBM Concert v3.1.0 on EKS: Hub + Concert + Data Apps + Workflows (no Secure Coder)
# Based on etc/sample-params/concert-workflows-k8s-quickstart-params.ini from the v3.1.0 package, plus the
# Data Apps keys from concert-dataapps-k8s-quickstart-params.ini (3.0.0 names; check against the 3.1.0 sample).
# Placeholders in __DOUBLE_UNDERSCORES__ are filled by scripts/01-install-concert.sh.
# Secrets (WATSONX_API_KEY, entitlement key, admin password) are NOT stored here; they are exported as env vars.

INSTALL_EKS=TRUE
REG_USER=cp
# The 3.1.0 sample file says icr.io/cp, but setup's own default is cp.icr.io/cp (the entitled registry),
# which is what the 3.0.0 EKS install used successfully.
IMAGE_REGISTRY_PREFIX=cp.icr.io/cp

# ----- Hub -----
HUB_NS=concert-hub
HUB_IMAGE_REGISTRY_SUFFIX=/platform-hub
# Installs ITOM (agent registry + AI agents). Was blank in the 3.0.0 install, which broke agent registration.
ENABLE_CROSS_PRODUCT_INTEGRATION=true
SCALE_CONFIG_HUB=level_1
STORAGE_CLASS_HUB=__STORAGE_CLASS__

# ----- Concert -----
INSTALL_CONCERT=true
CONCERT_NS=concert
CONCERT_IMAGE_REGISTRY_SUFFIX=/concert
SCALE_CONFIG_CONCERT=level_1
STORAGE_CLASS_CONCERT=__STORAGE_CLASS__
ENABLE_HPA=false
# roja-buddy (agents/MCP service, new in 3.1) needs ReadWriteMany volumes; EBS cannot do RWX, so use EFS
# (created by scripts/00b-create-efs.sh). Without this the install fails at "roja-buddy exceeded its progress deadline".
FILE_STORAGE_CLASS_CONCERT=efs-sc

# ----- Data Apps (shown inside the Concert UI; must NOT get its own ingress on '/') -----
INSTALL_DATAAPPS=true
DATAAPPS_NS=dataapps
DATAAPPS_IMAGE_REGISTRY_SUFFIX=/concert
SCALE_CONFIG_DATAAPPS=level_1
STORAGE_CLASS_DATAAPPS=__STORAGE_CLASS__

# ----- Concert Workflows -----
INSTALL_WORKFLOWS=true
WORKFLOWS_INSTANCE_ADDRESS=__WORKFLOWS_LB__

# ----- AI (new in 3.1.0: configured at install time instead of patching configmaps afterwards) -----
# SaaS watsonx.ai: export WATSONX_API_KEY before running setup (never put it in this file).
ENABLE_AI=true
WATSONX_API_URL=__WATSONX_API_URL__
WATSONX_API_PROJECT_ID=__WATSONX_API_PROJECT_ID__
# Default model is ibm/granite-4-h-small
# WATSONX_API_MODEL_ID=ibm/granite-4-h-small
